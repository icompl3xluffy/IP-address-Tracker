<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Address Tracker</title>
     <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="" defer></script>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer ></script>
</head>
<body>
    <header>
        <h1>IP Address Tracker</h1>

        <form id="ip-form">
            <label for="ip-search">IP-Address or Domain</label>
            <input id="ip-search" type="text" name="ip-search" placeholder="Search for any IP address or domain" required>
            <button type="submit">&#10095;</button>
        </form>
    </header>

    <main>
        <div id="ip-map" ></div>
        <div id="result-section">
                
                    <dl aria-live="polite" aria-atomic="true">
                        <div class="ip-info">
                        <dt>IP ADDRESS</dt>
                        <dd id="addressValue" ></dd>
                        </div>

                        <div class="ip-info">
                        <dt>LOCATION</dt>
                        <dd id="locationValue" ></dd>
                        </div>

                        <div class="ip-info">
                        <dt>TIMEZONE</dt>
                        <dd id="timezoneValue" ></dd>
                        </div>

                        <div class="ip-info">
                        <dt>ISP</dt>
                        <dd id="ispValue"></dd>
                        </div>
                    </dl>
                    
                
            

                </div>

    </main>
</body>
</html>
